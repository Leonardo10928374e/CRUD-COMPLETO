<!DOCTYPE html>

<body>

        <input type="number" id="identificadorCPF" placeholder="Digite seu CPF..." required>

        <label for="">Senha:</label>

        <br><br>
        <label for="">Rua:</label>

        <br><br>

        <input type="number" id="cep" placeholder="Digite seu CEP..." required>

        <label for="">Estado:</label>

        <br><br>
        <label for="">Telefone:</label>
        <input type="text" id="telefone" placeholder="Digite seu telefone..." required>
        <br><br>
